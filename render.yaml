services:
  - type: web
    name: ai-ops-monitor-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_NAME
        value: AI Ops Monitor
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_SQL
        value: false
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MONITORING_INTERVAL_SECONDS
        value: 60
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: ai-ops-monitor-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info
      --pool=solo
      --concurrency=1
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_NAME
        value: AI Ops Monitor
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_SQL
        value: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MONITORING_INTERVAL_SECONDS
        value: 60
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: ai-ops-monitor-beat
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_NAME
        value: AI Ops Monitor
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_SQL
        value: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MONITORING_INTERVAL_SECONDS
        value: 60
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
